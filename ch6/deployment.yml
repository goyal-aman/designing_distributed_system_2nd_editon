apiVersion: apps/v1
kind: Deployment
metadata:
  name: ch6app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ch6app
  template:
    metadata:
      labels:
        app: ch6app
    spec:
      containers:
      - name: ch6app
        image: ch6app
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
--- 
apiVersion: v1
kind: Service
metadata:
  name: ch6app
spec:
  type: NodePort
  selector:
    app: ch6app
  ports:
    - port: 8080